name: Archivage Hub'Eau (historique marée/débit)

on:
  schedule:
    - cron: '17 3 * * 1'   # tous les lundis 03:17 UTC (rétention Hub'Eau = 1 mois)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tirer et empiler les séries
        run: |
          python -m pip install requests
          cd collector && python archive.py

      - name: Commit de l'archive si modifiée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collector/archive
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée à archiver."
          else
            git commit -m "Archive Hub'Eau: maj séries marée/débit [skip ci]"
            git push
          fi
