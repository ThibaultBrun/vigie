name: vigie-db

services:
  db:
    image: postgres:17-alpine
    container_name: vigie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigie
      POSTGRES_USER: vigie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans db/.env}
    ports:
      - "127.0.0.1:5433:5432"   # exposé uniquement en local (le collecteur tourne sur le VPS)
    volumes:
      - vigie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigie -d vigie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Admin web léger, exposé uniquement via le VPN WireGuard (10.7.0.1)
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: vigie-pgweb
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://vigie:${POSTGRES_PASSWORD:?définir dans db/.env}@db:5432/vigie?sslmode=disable
    ports:
      - "10.7.0.1:8081:8081"   # accessible seulement à travers le tunnel WireGuard

volumes:
  vigie_pgdata:
